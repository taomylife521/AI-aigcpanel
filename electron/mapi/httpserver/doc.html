<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #1d2129; line-height: 1.6; }
  .header { background: #1d2129; color: #fff; padding: 24px 40px; }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 14px; color: #aaa; margin-top: 4px; }
  .container { max-width: 900px; margin: 32px auto; padding: 0 24px; }
  h2 { font-size: 20px; font-weight: 600; margin: 32px 0 16px; padding-bottom: 8px; border-bottom: 1px solid #e5e8ef; }
  h3 { font-size: 16px; font-weight: 600; margin: 24px 0 12px; }
  h4 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
  p { margin: 8px 0; }
  ul, ol { padding-left: 20px; margin: 8px 0; }
  li { margin: 4px 0; }
  strong { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  th { text-align: left; padding: 8px 12px; background: #f7f8fa; color: #86909c; font-weight: 500; border-bottom: 1px solid #e5e8ef; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f1f5; color: #4e5969; vertical-align: top; }
  td:first-child { font-family: monospace; color: #165dff; }
  tr:last-child td { border-bottom: none; }
  pre { background: #f7f8fa; border-radius: 6px; padding: 14px 16px; font-size: 13px; overflow-x: auto; line-height: 1.7; color: #1d2129; border: 1px solid #e5e8ef; margin: 12px 0; }
  code { background: #f7f8fa; padding: 2px 6px; border-radius: 3px; font-size: 12px; font-family: monospace; }
  pre code { background: none; padding: 0; border-radius: 0; }
  blockquote { border-left: 3px solid #165dff; padding: 8px 16px; margin: 12px 0; background: #f7f8fa; border-radius: 0 4px 4px 0; }
  hr { border: none; border-top: 1px solid #e5e8ef; margin: 24px 0; }
  .required { color: #f53f3f; font-size: 11px; margin-left: 4px; }
  .optional { color: #86909c; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>
<div class="header">
  <h1>AIGCPanel HTTP 接口文档</h1>
  <p>Base URL：http://{{BIND_ADDR}}:{{PORT}}</p>
</div>
<div class="container">
  {{CONTENT}}
</div>
</body>
</html>
